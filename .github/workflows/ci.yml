name: ci

on:
  pull_request:
  push:
    branches: [main]

# CI 는 **시크릿을 하나도 쓰지 않는다.** dev 타깃은 로컬 DuckDB 카탈로그 +
# 로컬 디렉토리라 러너 안에서 완결된다. 덕분에 포크 PR 에서도 돌고, 외부 API 를
# 호출하지 않아 rate limit 도 비용도 없다.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TECHRADAR_TARGET: dev
      DBT_PROFILES_DIR: dbt/profiles
      TECHRADAR_DEV_CATALOG: ${{ github.workspace }}/data/catalog.ducklake
      TECHRADAR_DEV_DATA_PATH: ${{ github.workspace }}/data/lakehouse/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # embed extra(torch, ~2GB) 는 설치하지 않는다. 임베딩 로직 테스트는
      # 인코더를 대역으로 바꿔 돌리므로 실모델이 필요 없다.
      - run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run pytest -q

      # 빈 카탈로그를 만든다(bootstrap 이 ops/bronze/ml DDL 을 친다).
      - name: bootstrap empty lakehouse
        run: uv run techradar status

      # ★ 두 번 돌리는 것이 핵심이다.
      #
      # dbt 의 is_incremental() 분기는 **첫 실행에서는 컴파일조차 되지 않는다**.
      # 그래서 1회차만 도는 CI 는 incremental 모델 버그를 통째로 놓친다.
      # 실제로 dq__alert_dispatch 가 1회차 통과 후 2회차에 Binder Error 로
      # 터진 적이 있다(`{{ this }}` 의 컬럼명이 severity 인데 status 로 조회).
      #
      # 데이터가 0건이어도 SQL 은 그대로 실행되므로 컴파일·바인딩 오류는 다 잡힌다.
      # 잡지 못하는 것: 값에 의존하는 로직(임계값 판정, 랭킹 순서). 그건 단위
      # 테스트와 실데이터의 몫이다.
      - name: dbt build (1회차 — 최초 생성)
        run: |
          uv run dbt seed --project-dir dbt
          uv run dbt build --project-dir dbt

      - name: dbt build (2회차 — incremental 분기)
        run: uv run dbt build --project-dir dbt
