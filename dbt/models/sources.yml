version: 2

sources:
  - name: lake
    database: lake
    schema: main
    description: >
      Python 커넥터가 직접 쓰는 테이블들. dbt 는 읽기만 한다.
      bronze 를 dbt 모델로 만들지 않는 이유는, 적재가 수집 워터마크와 같은
      트랜잭션에 묶여야 하기 때문이다(dbt 는 그 트랜잭션 경계를 표현할 수 없다).
    tables:
      - name: bronze__raw_item
        description: 소스 원본 payload. 파싱하지 않고 보존한다.
        loaded_at_field: fetched_at
        freshness:
          # 일 1회 수집이므로 26시간이면 한 번 걸렀다는 뜻.
          warn_after: { count: 26, period: hour }
          error_after: { count: 48, period: hour }
        columns:
          - name: source_name
            description: "'arxiv:cs.AI' 처럼 소스×세부구분. 워터마크의 grain 과 동일."
          - name: native_id
            description: 소스 고유 ID (arXiv 는 버전 접미사를 뗀 값).
          - name: payload_hash
            description: payload 내용 해시. 멱등키의 일부라 내용이 바뀌면 새 행이 된다.
          - name: event_ts
            description: 이벤트 발생 시각(발행일). 커서 전진의 근거.
          - name: fetched_at
            description: 수집 시각. silver incremental 필터가 쓰는 기준.

      - name: ml__embedding
        description: >
          문서 임베딩. grain = doc_id × model_name × content_hash.
          Python embed 잡이 append 하고 dbt 는 읽기만 한다.
          model_name 이 grain 에 있어 여러 모델 임베딩이 공존할 수 있으므로
          vec 은 고정 크기가 아닌 FLOAT[] 가변 리스트다.
        columns:
          - name: content_hash
            description: silver__document.content_hash 와 일치해야 최신 임베딩으로 인정된다.
          - name: vec
            description: L2 정규화된 임베딩. 정규화했으므로 코사인 = 내적.

      - name: ml__interest_embedding
        description: 관심 토픽 임베딩. 문서와 같은 모델이어야 비교가 의미를 가진다.
      - name: ops__digest_delivery
        description: >
          다이제스트 실제 발송 결과. Python 이 쓴다.
          dispatch 가 '이미 보낸 문서'를 제외할 때 이 테이블을 본다 —
          '선정됨'이 아니라 '발송 성공'을 기준으로 삼아야 전송 실패한 문서가
          다음날 다시 후보에 오른다.

      - name: ops__source_watermark
        description: 소스별 수집 커서. Phase 6 의 정체 탐지가 읽는다.
      - name: ops__ingest_run_log
        description: append-only 실행 기록. Phase 6 의 볼륨 급감 탐지가 읽는다.
