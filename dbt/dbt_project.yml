name: "techradar"
version: "0.1.0"
profile: "techradar"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # silver incremental 이 되돌아보는 폭. 이벤트 시각이 아니라 **수집 시각** 기준이다.
  # at-least-once 로 재처리해도 merge 가 멱등이므로 넉넉히 잡는 편이 안전하다.
  silver_lookback_days: 2

  # 임베딩 모델 이름. ml__embedding 의 grain 에 들어가므로, 이 값을 바꾸면
  # 전량 삭제 없이 새 모델로 백필이 시작된다(옛 임베딩은 남아 롤백 가능).
  embed_model: "Qwen/Qwen3-Embedding-0.6B"

  # 런당 임베딩 상한. GH Actions 러너 타임아웃을 막는 안전판이고,
  # 남은 백로그는 다음 실행이 집어간다.
  embed_batch_cap: 2000

  # 다이제스트에 들어갈 최소 관심도. 실측 분포(398건)에서 정했다:
  #   전체 median 0.391 / p95 0.546 / max 0.782
  #   0.45 통과 = arxiv 14% · hackernews 67%
  # 소스별 쿼터(4건)보다 충분히 많으므로 평상시엔 쿼터가 선택을 하고,
  # 이 값은 정말 건질 게 없는 날에만 작동한다.
  digest_affinity_floor: 0.45

  # engagement 보정이 최대(×2)가 되는 일일 점수 상승폭. 로그 스케일이라
  # 2000 을 넘어도 완만하게만 오른다 — 인기가 관련성을 압도하면 안 되므로
  # 세 신호 중 가장 약하게 설계했다.
  engagement_full_scale: 2000

  # ── DQ 임계값 ─────────────────────────────────────────────
  # 볼륨 급감: 트레일링 중앙값 대비 이 비율 미만이면 warn.
  # 평균이 아니라 중앙값을 쓰는 이유는 스파이크 하루가 기준선을 통째로 끌어올려
  # 그 뒤 며칠을 전부 '급감'으로 만드는 걸 막기 위함이다.
  dq_volume_drop_ratio: 0.4

  # 중앙값을 신뢰하려면 관측이 이만큼은 있어야 한다. 미만이면 판정하지 않고
  # insufficient_data 로 남긴다 — 조용히 '통과'로 처리하면 검사를 안 하면서
  # 검사한 척하게 된다.
  dq_volume_min_observations: 7

  # 마지막 성공 수집 이후 경과 시간. 일 1회 수집이므로 26h 면 한 번 걸렀다는 뜻.
  dq_freshness_warn_hours: 26
  dq_freshness_critical_hours: 48

  # 한 관심토픽이 이 비율을 넘겨 독식하면 관심프로필과 코퍼스가 어긋났다는 신호.
  # 2026-09-08 에 'LLM 활용'이 69% 를 먹은 걸 눈으로 발견했는데, 그런 건
  # 자동으로 잡혀야 한다.
  dq_topic_domination_ratio: 0.40

  # 같은 체크를 매일 반복 통보하지 않는다. 알림 피로가 쌓이면 진짜 경고를 놓친다.
  dq_alert_cooldown_hours: 20

seeds:
  techradar:
    +database: lake
    +schema: main

models:
  techradar:
    +database: lake
    silver:
      +materialized: incremental
    gold:
      +materialized: table
